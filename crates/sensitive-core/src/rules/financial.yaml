# Règles « données financières » — catégorie financial.

- id: fin.iban
  name: IBAN
  severity: high
  type: iban
  label_fr: Compte bancaire (IBAN)
  category: financial
  extract:
    pattern: '(?i)\b[a-z]{2}\d{2}[a-z0-9]{10,30}\b'
    max_length: 34
  validate:
    algorithm: iban_mod97
    require_country_prefix: true
  context:
    keywords: [iban, rib, compte, virement, swift, banque, relevé]
    window: 80
  redaction:
    strategy: keep_last4
  confidence:
    verified_with_context: certain
    verified: probable
    format_only: possible

- id: fin.card
  name: Numéro de carte bancaire
  severity: high
  type: card
  label_fr: Numéro de carte bancaire
  category: financial
  extract:
    pattern: '\b(?:\d[ -]?){12,18}\d\b'
    max_length: 23
  validate:
    algorithm: luhn
  context:
    keywords: [carte, cb, visa, mastercard, paiement, card, numéro]
    window: 80
  redaction:
    strategy: keep_last4
  confidence:
    verified_with_context: certain
    verified: probable
    format_only: possible

- id: fin.rib
  name: RIB français
  severity: high
  type: rib
  label_fr: Relevé d'identité bancaire (RIB)
  category: financial
  extract:
    pattern: '\b\d{23}\b'
    max_length: 23
  validate:
    algorithm: rib_fr
  context:
    keywords: [rib, banque, guichet, clé, compte, virement]
    window: 80
  redaction:
    strategy: keep_last4
  confidence:
    verified_with_context: certain
    verified: probable
    format_only: possible

- id: fin.ean13
  name: Code produit EAN-13
  severity: low
  type: ean13
  label_fr: Code produit (EAN-13)
  category: financial
  extract:
    pattern: '\b\d{13}\b'
    max_length: 13
  validate:
    algorithm: ean13
  context:
    keywords: [ean, code-barres, barcode, produit, référence]
    window: 64
  redaction:
    strategy: keep_last4
  confidence:
    verified_with_context: certain
    verified: probable
    format_only: possible
