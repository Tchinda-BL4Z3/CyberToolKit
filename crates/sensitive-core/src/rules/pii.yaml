# Règles « données personnelles » — catégorie pii.

- id: pii.french_nir
  name: Numéro INSEE (NIR)
  severity: high
  type: french_nir
  label_fr: Numéro de sécurité sociale (NIR)
  category: pii
  extract:
    pattern: '\b\d{15}\b'
    max_length: 15
  validate:
    algorithm: french_nir
  context:
    keywords: [nir, insee, secu, sécurité sociale, identifiant, allocataire]
    window: 80
  redaction:
    strategy: keep_last4
  confidence:
    verified_with_context: certain
    verified: probable
    format_only: possible

- id: pii.email
  name: Adresse électronique
  severity: low
  type: email
  label_fr: Adresse électronique
  category: pii
  extract:
    pattern: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?)+\b'
    max_length: 254
  validate:
    algorithm: email
  context:
    keywords: [mail, courriel, contact, adresse, destinataire]
    window: 64
  redaction:
    strategy: type_only
  confidence:
    verified_with_context: probable
    verified: probable
    format_only: possible

- id: pii.phone_fr
  name: Téléphone français
  severity: low
  type: phone_fr
  label_fr: Numéro de téléphone (France)
  category: pii
  extract:
    pattern: '(?:\b0[1-9]|\+\s*33\s*[1-9])(?:[\s.-]?\d{2}){4}\b'
    max_length: 20
  context:
    keywords: [téléphone, tel, phone, portable, mobile, contact]
    window: 64
  redaction:
    strategy: keep_last4
  confidence:
    verified_with_context: probable
    verified: probable
    format_only: possible
