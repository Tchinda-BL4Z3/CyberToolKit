# Règles « identifiants et secrets » — catégorie credentials.
# Ajout d'une règle : copier un bloc, changer l'identifiant, `scanner rules list`.

- id: cred.aws_access_key
  name: Clé d'accès AWS
  severity: high
  type: aws_access_key
  label_fr: Clé d'accès AWS
  category: credentials
  extract:
    pattern: '\b(?:AKIA|ASIA|AGPA|AIDA|AROA|ANPA|ANVA)[0-9A-Z]{16}\b'
    max_length: 20
  validate:
    algorithm: aws_access_key
  context:
    keywords: [aws, amazon, access, key, clé, secret, iam]
    window: 80
  redaction:
    strategy: keep_last4
  confidence:
    verified_with_context: certain
    verified: certain
    format_only: possible

- id: cred.private_key
  name: Clé privée PEM
  severity: high
  type: private_key
  label_fr: Clé privée (en-tête PEM)
  category: credentials
  extract:
    pattern: '-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----'
    max_length: 64
  validate:
    algorithm: private_key_pem
  redaction:
    strategy: type_only
  confidence:
    verified_with_context: certain
    verified: certain
    format_only: possible

- id: cred.jwt
  name: Jeton JWT
  severity: medium
  type: jwt
  label_fr: Jeton d'authentification (JWT)
  category: credentials
  extract:
    pattern: '\beyJ[A-Za-z0-9_-]{4,}\.[A-Za-z0-9_-]{4,}\.[A-Za-z0-9_-]{4,}\b'
    max_length: 4096
  validate:
    algorithm: jwt
  context:
    keywords: [jwt, token, bearer, authorization, session, jeton]
    window: 64
  redaction:
    strategy: keep_last4
  confidence:
    verified_with_context: certain
    verified: probable
    format_only: possible

- id: cred.password
  name: Mot de passe en clair
  severity: high
  type: password
  label_fr: Mot de passe en clair
  category: credentials
  extract:
    pattern: '(?i)(?:password|passwd|pwd|mot\s+de\s+passe)\s*[:=]\s*[''"]?([^\s''"`]{6,64})'
    capture: 1
    max_length: 64
  context:
    keywords: [password, passwd, pwd, mot de passe]
    window: 96
  redaction:
    strategy: type_only
  confidence:
    verified_with_context: certain
    verified: probable
    format_only: possible

- id: cred.api_key
  name: Clé d'API générique
  severity: medium
  type: api_key
  label_fr: Clé d'API ou secret applicatif
  category: credentials
  extract:
    pattern: '(?i)(?:api[_-]?key|secret[_-]?key|clé\s+d[''’]api|token)\s*[:=]\s*[''"]?([A-Za-z0-9_\-]{16,64})'
    capture: 1
    max_length: 64
  validate:
    algorithm: entropy
    min_entropy: 3.5
  context:
    keywords: [api, key, clé, secret, token, client]
    window: 80
  redaction:
    strategy: keep_last4
  confidence:
    verified_with_context: certain
    verified: probable
    format_only: possible
