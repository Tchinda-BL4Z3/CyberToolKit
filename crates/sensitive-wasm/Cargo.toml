[package]
name = "sensitive-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cible wasm32 du moteur : même code, ABI C simple, aucun wasm-bindgen."

[lib]
name = "sensitive_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
sensitive-core = { path = "../sensitive-core" }
sensitive-extract = { path = "../sensitive-extract" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
zeroize.workspace = true

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
