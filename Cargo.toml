[workspace]
resolver = "2"
members = [
    "crates/sensitive-core",
    "crates/sensitive-cli",
    "crates/sensitive-wasm",
    "crates/sensitive-extract",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
zeroize = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
